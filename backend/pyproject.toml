[project]
name = "baskici-backend"
version = "0.1.0"
description = "Baskici SaaS backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "authlib>=1.3.2",
    "itsdangerous>=2.2.0",
    "email-validator>=2.0",
    "PyMuPDF>=1.24",
    "apscheduler>=3.10",
    "openpyxl>=3.1",
    "anthropic>=0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
