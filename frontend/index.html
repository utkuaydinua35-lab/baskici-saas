<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BERNZ Sipariş ve Kalıp Yönetim Sistemi</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BERNZ" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Oturum isteğini JS paketi İNMEDEN başlat.
         İlk açılışta zincir seriydi: HTML → index.js (indir+ayrıştır) →
         /api/auth/me → sayfa chunk'ı → sayfanın kendi verisi. AuthProvider
         /me dönene kadar hiçbir rota render etmediği için bu istek kritik
         yolda. Buradan başlatınca paketin inme süresi kadar öne çekiliyor;
         auth.jsx hazırsa bu sözü kullanır, yoksa normal yoldan ister. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('baskici_token')
          if (!t) return
          window.__meSozu = fetch('/api/auth/me', {
            headers: { Accept: 'application/json', Authorization: 'Bearer ' + t },
          }).then(function (r) { return r.ok ? r.json() : null })
            .catch(function () { return null })
        } catch (e) { /* localStorage kapalı olabilir — normal yola düşülür */ }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
