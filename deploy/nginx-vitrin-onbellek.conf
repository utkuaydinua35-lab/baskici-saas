# Vitrin sayfa önbelleği — `location /` içine include edilir.
# Kurulum (root): cp …/deploy/nginx-vitrin-onbellek.conf /etc/nginx/snippets/vitrin-onbellek.conf
# Tanımlar: nginx-vitrin-onbellek-http.conf (conf.d)
proxy_cache            vitrin;
proxy_cache_key        "$scheme$host$uri?$vt_args";
proxy_cache_valid      200 30s;
proxy_cache_valid      404 10s;
proxy_cache_bypass     $vt_yontem $vt_cerez $vt_yol $vt_rsc $vt_onizleme;
proxy_no_cache         $vt_yontem $vt_cerez $vt_yol $vt_rsc $vt_onizleme $upstream_http_set_cookie;
# Next.js dinamik sayfaya "no-store" yazar; nginx kendi kuralına göre saklar.
# Başlık TARAYICIYA olduğu gibi gider (tarayıcı/Cloudflare HTML saklamaz).
proxy_ignore_headers   Cache-Control Expires;
# Süre dolunca bekletme: eski kopyayı ver, arkada tazele; aynı sayfa için tek tazeleme
proxy_cache_use_stale  updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock       on;
proxy_cache_lock_timeout 5s;
# Teşhis: HIT / MISS / STALE / UPDATING / BYPASS
add_header X-Vitrin-Onbellek $upstream_cache_status always;
