# BERNZ Commerce — vitrin + mağaza paneli nginx yapılandırması.
# Kurulum (root):
#   cp /home/baskici/baskici-saas/deploy/nginx-vitrin.conf /etc/nginx/sites-available/vitrin
#   ln -sf /etc/nginx/sites-available/vitrin /etc/nginx/sites-enabled/vitrin
#   cp /home/baskici/baskici-saas/deploy/nginx-vitrin-onbellek-http.conf /etc/nginx/conf.d/vitrin-onbellek.conf
#   cp /home/baskici/baskici-saas/deploy/nginx-vitrin-onbellek.conf /etc/nginx/snippets/vitrin-onbellek.conf
#   nginx -t && systemctl reload nginx
# Sayfa önbelleği: vitrin bloklarının `location /` içinde `include snippets/vitrin-onbellek.conf;`
# (yeni kiracı alan adı bloğu açılırken de eklenmeli).
#
# ANA ADRES: https://bernzcompany.com (2026-10, Shopify kapandı). www. ve magaza.
# buraya 301 ile yönlenir — tek adres = Google'da tek sayfa, Meta'da tek alan adı.
#
# SERTİFİKA — Cloudflare Origin sertifikası (*.bernzcompany.com + bernzcompany.com,
# 2041'e kadar geçerli). Let's Encrypt KULLANMA: 2026-10'da alan adı bağlanırken
# LE sertifikasına geçildi; o sertifika magaza.bernzcompany.com'u kapsamıyordu
# ve 90 günde bir yenilenmesi gerekiyordu (Cloudflare proxy arkasında HTTP
# doğrulaması kırılgan). Sonuç: 525 "SSL handshake failed", site açılmadı.
# Cloudflare SSL modu: Full (strict). Origin sertifikası yalnız Cloudflare'ın
# güvendiği bir sertifikadır — DNS kaydı turuncu (proxy açık) olmak ZORUNDA.
#
# DNS (Cloudflare, hepsi proxy açık) -> 91.132.49.107:
#   bernzcompany.com, www, magaza, magazapanel, studio, siparistakip
# NOT: panel.magaza.bernzcompany.com KULLANILMADI — iki seviyeli alt alan adı
# Cloudflare'ın standart (*.bernzcompany.com) sertifikasına sığmaz.

server {
    listen 80;
    server_name bernzcompany.com www.bernzcompany.com magaza.bernzcompany.com magazapanel.bernzcompany.com;
    return 301 https://$host$request_uri;
}

# www. ve eski magaza. adresi → ana adres (yol + sorgu korunur: fbclid/utm kaybolmaz).
# 308 (301 değil): POST da gövdesiyle yönlenir — eski adrese gelen bir form/
# bildirim isteği sessizce GET'e dönüşüp kaybolmasın. Google 308'i 301 sayar.
server {
    listen 443 ssl http2;
    server_name www.bernzcompany.com magaza.bernzcompany.com;
    ssl_certificate     /etc/ssl/cloudflare/baskici.pem;
    ssl_certificate_key /etc/ssl/cloudflare/baskici.key;
    return 308 https://bernzcompany.com$request_uri;
}

# Vitrin (müşterilerin gördüğü mağaza) — Next.js sunucusuna proxy
server {
    listen 443 ssl http2;
    server_name bernzcompany.com;
    ssl_certificate     /etc/ssl/cloudflare/baskici.pem;
    ssl_certificate_key /etc/ssl/cloudflare/baskici.key;
    client_max_body_size 30M;   # kişiye özel tasarım yükleme (25MB) payı

    # ── Güvenlik başlıkları: BURADA DEĞİL, next.config.ts'te ──
    # Eskiden hem burada hem Next.js'te basılıyordu → her başlık yanıtta İKİ
    # kez gidiyordu (dış güvenlik incelemesi, 22.09.2026). İki CSP başlığında
    # tarayıcı İKİSİNİ BİRDEN uygular; bugün aynılar ama biri değişirse
    # sessizce kesişirler. Tek kaynak Next.js: her yeni kiracı alan adı bu
    # dosyanın bir kopyasıyla açıldığından, başlıklar burada kalsaydı her
    # blokta elle tekrarlanmak zorundaydı (add_header miras tuzağı dahil).

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Sayfa önbelleği (katalog sayfaları, 30 sn + arkada tazeleme)
        include snippets/vitrin-onbellek.conf;
    }
}

# Mağaza yönetim paneli (BERNZ Commerce) — statik + API proxy
server {
    listen 443 ssl http2;
    server_name magazapanel.bernzcompany.com;
    ssl_certificate     /etc/ssl/cloudflare/baskici.pem;
    ssl_certificate_key /etc/ssl/cloudflare/baskici.key;
    client_max_body_size 220M;  # ürün videosu yükleme (100MB) payı
    root /srv/baskici/panel/dist;
    index index.html;

    # ── Güvenlik başlıkları (yönetim paneli — vitrinden daha sıkı) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;   # panel hiçbir iframe'e girmez
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    location = /robots.txt { add_header Content-Type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    # Service worker ASLA uzun önbelleğe alınmamalı. Cloudflare .js uzantısını
    # varsayılan olarak önbelleğe alıyor; deploy öncesi bir istek gelirse
    # /sw.js'in index.html cevabı 4 saat boyunca çakılı kalıyor ve PWA hiç
    # kurulmuyor (2026-08-19'da yandı). manifest.json .json olduğu için
    # önbelleğe girmiyordu — bu yüzden yalnız sw.js bozuk görünüyordu.
    #
    # DİKKAT — nginx'te add_header MİRAS ALINMAZ: bir location kendi
    # add_header'ını tanımlarsa ÜST seviyedeki TÜM add_header'lar o yanıt
    # için düşer. Aşağıdaki blokların her biri güvenlik başlıklarını
    # yeniden yazmak ZORUNDA; yoksa panelin HSTS/X-Frame-Options/nosniff
    # koruması SPA'nın ana sayfa yanıtında kaybolur (2026-08-19'da oldu).
    location = /sw.js {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    # Uygulama kabuğu da bayatlamasın (asset'ler hash'li, onlar önbelleklenebilir)
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /api/     { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 300s; }
    location /storage/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location /         { try_files $uri /index.html; }
}
