<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: durum çubuğu "black-translucent" olduğu için ana
         ekrana eklenen uygulamada sayfa çentiğin ALTINA uzanıyor; bu olmadan
         env(safe-area-inset-*) 0 döner ve üst çubuk saatin altında kalır. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <meta name="theme-color" content="#0b1437" />
    <!-- PWA: telefonda "Ana Ekrana Ekle" ile uygulama gibi kurulur -->
    <link rel="manifest" href="/manifest.json" />
    <!-- ?v=2: iOS ana ekran ikonunu ADRESE göre önbelleğe alır ve bir daha
         sormaz. İlk kurulumda dosya bozuk geldiyse (Cloudflare index.html
         serviyordu) ikon "C" harfi olarak çakılı kalır; sürüm eki olmadan
         uygulamayı silip yeniden eklemek bile düzeltmez. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Commerce" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>BERNZ Commerce</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
