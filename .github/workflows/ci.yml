name: CI

# Her push ve PR'da backend import/derleme + frontend build smoke testi.
# Amac: boot'u bozan / build'i kiran hatalari VPS'e gitmeden yakalamak.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile (syntax)
        run: python -m compileall -q backend/app
      - name: Import app + configure mappers (import/iliski hatalari)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
          JWT_SECRET: "ci-dummy-secret"
          SESSION_SECRET: "ci-dummy-session"
          ENV: "ci"
        run: |
          python -c "import app.main; from sqlalchemy.orm import configure_mappers; configure_mappers(); print('backend import + mappers OK')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: storefront
        run: npm ci
      - name: Build
        working-directory: storefront
        run: npm run build

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: panel
        run: npm ci
      - name: Build
        working-directory: panel
        run: npm run build
