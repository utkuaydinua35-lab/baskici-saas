# Lunera Case — müşterinin kendi alan adı (özel domain) vitrin bloğu.
#
# YENİ BİR MAĞAZA İÇİN BU DOSYAYI KOPYALA, iki şeyi değiştir:
#   1) server_name satırlarındaki alan adı
#   2) ssl_certificate / ssl_certificate_key yolları (o alan adının
#      Cloudflare Origin sertifikası)
# Vitrin uygulaması tektir (127.0.0.1:3001); hangi mağaza olduğunu Host
# başlığından /api/shop/_resolve ile çözer. Yani ayrı süreç GEREKMEZ.
#
# Kurulum (root):
#   cp /home/baskici/baskici-saas/deploy/nginx-luneracase.conf \
#      /etc/nginx/sites-available/luneracase
#   ln -sf /etc/nginx/sites-available/luneracase /etc/nginx/sites-enabled/luneracase
#   nginx -t && systemctl reload nginx
#
# ÖN KOŞULLAR
#   • Cloudflare'de zone açık, nameserver'lar Cloudflare'e taşınmış
#   • A kaydı: @ ve www -> 91.132.49.107, TURUNCU BULUT AÇIK (proxy)
#     (origin güvenlik duvarı yalnız Cloudflare IP'lerini kabul ediyor)
#   • SSL/TLS modu: FULL (STRICT). "Flexible" seçilirse Cloudflare origin'e
#     http konuşur, aşağıdaki 80->443 yönlendirmesi sonsuz döngüye girer.
#   • Origin sertifikası sunucuda: .pem (sertifika) + .key (özel anahtar)
#   • Panelde Ayarlar > Alan Adı olarak luneracase.com kaydedilmiş olmalı;
#     yoksa vitrin host'u çözemez ve varsayılan mağazayı gösterir.

server {
    listen 80;
    server_name luneracase.com www.luneracase.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name luneracase.com www.luneracase.com;

    ssl_certificate     /etc/ssl/cloudflare/lunera.pem;
    ssl_certificate_key /etc/ssl/cloudflare/lunera.key;

    client_max_body_size 30M;   # kişiye özel tasarım yükleme (25MB) payı

    # ── Güvenlik başlıkları (vitrin bloğuyla aynı) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Tema editörünün canlı önizlemesi paneli iframe'e alır; panel adresleri
    # dışında hiçbir site gömemez
    add_header Content-Security-Policy "frame-ancestors 'self' https://magazapanel.bernzcompany.com https://studio.bernzcompany.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;          # mağaza çözümü buna bakar
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
