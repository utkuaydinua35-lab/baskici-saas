name: CI

# Her push ve PR'da backend import/derleme + frontend build + veritabani
# gerektirmeyen test paketleri.
# Amac: boot'u bozan / build'i kiran / davranisi degistiren hatalari VPS'e
# gitmeden yakalamak.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile (syntax)
        run: python -m compileall -q backend/app

      # Tanimsiz isim = calisma aninda NameError. 2026-09-08'de bu yuzden bir
      # GUVENLIK KONTROLU sessizce olmustu: SafeStaticFiles'ta `Path` import
      # edilmemis, NameError'i ciplak `except` yutmus, SVG/HTML koruması
      # yazildigi gunden beri hic calismamisti. Derleme bunu yakalamaz.
      - name: Tanimsiz isim taramasi (pyflakes F821)
        working-directory: backend
        run: |
          pip install pyflakes
          if python -m pyflakes app scripts | grep -i "undefined name"; then
            echo "::error::Tanimsiz isim bulundu — calisma aninda NameError olur."
            exit 1
          fi
          echo "tanimsiz isim yok"
      - name: Import app + configure mappers (import/iliski hatalari)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
          JWT_SECRET: "ci-dummy-secret"
          SESSION_SECRET: "ci-dummy-session"
          ENV: "ci"
        run: |
          python -c "import app.main; from sqlalchemy.orm import configure_mappers; configure_mappers(); print('backend import + mappers OK')"

  # 44 test paketi elle kosuluyordu ve her seferinde bir ALT KUMESI seciliyordu.
  # 2026-09-11'de tam bu yuzden surat_dogrudan_test gunlerce KIRIK kaldi
  # (bir fonksiyon iki deger donmeye basladi, test guncellenmedi, o gun o paket
  # hic kosulmadi). Artik DB istemeyen her paket her push'ta kosuyor.
  # DB isteyen paketler icin Postgres servisi eklenmeli — ayri is.
  testler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      # Etiket/barkod testleri PDF uretiyor. Sistemde gercek bir TTF yoksa
      # PyMuPDF base14'e duser ve Turkce karakterler ASCII'ye cevrilir —
      # etiket testi bunu yakalar. DejaVu, VPS'tekiyle ayni font.
      - name: Turkce font (etiket testleri icin)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - name: Test paketleri (DB gerektirmeyenler)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
          JWT_SECRET: "ci-dummy-secret"
          SESSION_SECRET: "ci-dummy-session"
          ENV: "ci"
        run: python scripts/ci_testleri.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: storefront
        run: npm ci
      - name: Build
        working-directory: storefront
        run: npm run build

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: panel
        run: npm ci
      - name: Build
        working-directory: panel
        run: npm run build
