# BERNZ Commerce — vitrin + mağaza paneli nginx yapılandırması.
# Kurulum (root):
#   cp /home/baskici/baskici-saas/deploy/nginx-vitrin.conf /etc/nginx/sites-available/vitrin
#   ln -sf /etc/nginx/sites-available/vitrin /etc/nginx/sites-enabled/vitrin
#   nginx -t && systemctl reload nginx
# DNS (Cloudflare): iki A kaydı -> 91.132.49.107 (proxy açık olabilir)
#   magaza.bernzcompany.com        (vitrin — müşteri sitesi)
#   magazapanel.bernzcompany.com   (yönetim paneli)
# NOT: panel.magaza.bernzcompany.com KULLANILMADI — iki seviyeli alt alan adı
# Cloudflare'ın standart (*.bernzcompany.com) sertifikasına sığmaz.

server {
    listen 80;
    server_name magaza.bernzcompany.com magazapanel.bernzcompany.com;
    return 301 https://$host$request_uri;
}

# Vitrin (müşterilerin gördüğü mağaza) — Next.js sunucusuna proxy
server {
    listen 443 ssl http2;
    server_name magaza.bernzcompany.com;
    ssl_certificate     /etc/ssl/cloudflare/baskici.pem;
    ssl_certificate_key /etc/ssl/cloudflare/baskici.key;
    client_max_body_size 30M;   # kişiye özel tasarım yükleme (25MB) payı

    # ── Güvenlik başlıkları (vitrin) ──
    # HSTS: tarayıcı bir daha http:// denemesin (1 yıl)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Clickjacking: siteyi iframe'e gömüp tıklama çalmayı engeller.
    # X-Frame-Options TEK origin destekler; panel farklı alt alan adında
    # olduğundan tema editörünün canlı önizlemesi "bağlanmayı reddetti"
    # hatası veriyordu → çok origin destekleyen CSP frame-ancestors.
    # Panel adresleri dışında hiçbir site gömemez (koruma kaybolmuyor).
    add_header Content-Security-Policy "frame-ancestors 'self' https://magazapanel.bernzcompany.com https://studio.bernzcompany.com" always;
    # MIME sniffing kapalı — yüklenen dosya "script" gibi yorumlanamaz
    add_header X-Content-Type-Options "nosniff" always;
    # Dış sitelere tam URL sızdırma (sipariş takip token'ı URL'de taşınır)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Kamera/mikrofon/konum izinleri hiç istenmesin
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Mağaza yönetim paneli (BERNZ Commerce) — statik + API proxy
server {
    listen 443 ssl http2;
    server_name magazapanel.bernzcompany.com;
    ssl_certificate     /etc/ssl/cloudflare/baskici.pem;
    ssl_certificate_key /etc/ssl/cloudflare/baskici.key;
    client_max_body_size 220M;  # ürün videosu yükleme (100MB) payı
    root /srv/baskici/panel/dist;
    index index.html;

    # ── Güvenlik başlıkları (yönetim paneli — vitrinden daha sıkı) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;   # panel hiçbir iframe'e girmez
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    location = /robots.txt { add_header Content-Type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    # Service worker ASLA uzun önbelleğe alınmamalı. Cloudflare .js uzantısını
    # varsayılan olarak önbelleğe alıyor; deploy öncesi bir istek gelirse
    # /sw.js'in index.html cevabı 4 saat boyunca çakılı kalıyor ve PWA hiç
    # kurulmuyor (2026-08-19'da yandı). manifest.json .json olduğu için
    # önbelleğe girmiyordu — bu yüzden yalnız sw.js bozuk görünüyordu.
    #
    # DİKKAT — nginx'te add_header MİRAS ALINMAZ: bir location kendi
    # add_header'ını tanımlarsa ÜST seviyedeki TÜM add_header'lar o yanıt
    # için düşer. Aşağıdaki blokların her biri güvenlik başlıklarını
    # yeniden yazmak ZORUNDA; yoksa panelin HSTS/X-Frame-Options/nosniff
    # koruması SPA'nın ana sayfa yanıtında kaybolur (2026-08-19'da oldu).
    location = /sw.js {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    # Uygulama kabuğu da bayatlamasın (asset'ler hash'li, onlar önbelleklenebilir)
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /api/     { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 300s; }
    location /storage/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location /         { try_files $uri /index.html; }
}
