# Vitrin sayfa önbelleği — http düzeyi tanımlar (TEK SEFER kurulur).
# Kurulum (root):  cp …/deploy/nginx-vitrin-onbellek-http.conf /etc/nginx/conf.d/vitrin-onbellek.conf
# Her vitrin sunucu bloğunun `location /` içine:  include snippets/vitrin-onbellek.conf;
#
# NEDEN: vitrin sayfaları her ziyarette Next.js'te baştan çiziliyordu (sunucu
# ~150-600 ms). Hazır HTML 30 sn tutulur; süre dolunca ziyaretçi bekletilmeden
# ESKİ kopya verilir ve arkada tazelenir (stale-while-revalidate). Yoğun
# saatte sayfalar neredeyse anında gelir, Next.js sunucusu da rahatlar.
#
# NE ÖNBELLEĞE GİRMEZ (ziyaretçiye özel ya da değişken):
#   • GET/HEAD dışı istekler
#   • önizleme (?onizleme= / vitrin_onizleme çerezi) ve yayın öncesi kilit çerezi
#   • katalog dışı yollar: sepet, ödeme, sipariş, hesap, favoriler, tasarla, api…
#   • Next.js istemci gezinmesi (RSC başlığı)
#   • Set-Cookie taşıyan yanıtlar
# Müşteriye özel her şey (sepet, hesap, favori sayısı) tarayıcıda çizildiği
# için önbellekteki HTML herkes için aynıdır.

proxy_cache_path /var/cache/nginx/vitrin levels=1:2 keys_zone=vitrin:20m
                 max_size=500m inactive=10m use_temp_path=off;

map $request_method $vt_yontem { GET 0; HEAD 0; default 1; }
map $http_cookie $vt_cerez {
    "~*(^|;\s*)(vitrin_onizleme|vitrin_kilit)="  1;
    default 0;
}
map $uri $vt_yol {
    /                 0;
    /urunler          0;
    ~^/urun/          0;
    ~^/koleksiyon/    0;
    ~^/sayfa/         0;
    ~^/blog(/|$)      0;
    default           1;
}
map $http_rsc $vt_rsc { "" 0; default 1; }
map $arg_onizleme $vt_onizleme { "" 0; default 1; }

# Reklam izleme parametreleri (fbclid, utm_…) anahtara GİRMEZ: her reklam
# tıklamasının fbclid'i farklı — girseydi reklam trafiği hiç önbellekten
# yararlanamazdı. Sayfa içeriği bu parametrelere bağlı değil; Meta çerezi
# tarayıcıda adres çubuğundan okunuyor.
map $args $vt_args {
    "~^((fbclid|gclid|gbraid|wbraid|ttclid|msclkid|igshid|_gl|utm_[a-z_]+)=[^&]*&?)+$"  "";
    default $args;
}
