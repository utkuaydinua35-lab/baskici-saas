# Bayi masaüstü uygulaması kurulum dosyaları — nginx DOĞRUDAN servis eder.
#
# NEDEN: .dmg/.exe dosyaları 90–100 MB. Bunlar /uploads üzerinden backend'e
# (uvicorn) proxy'leniyordu; her indirme bir worker'ı dakikalarca meşgul eder
# ve o sırada panel yavaşlar. Statik dosyayı nginx'in kendisi vermeli.
#
# KURULUM (root):
#   1) Aşağıdaki location bloğunu studio.bernzcompany.com server bloğunun
#      İÇİNE, diğer location'ların ÜSTÜNE yapıştır:
#        nano /etc/nginx/sites-available/baskici
#   2) nginx -t && systemctl reload nginx
#   3) Doğrula (indirme nginx'ten mi geliyor):
#        curl -sI https://studio.bernzcompany.com/uploads/uygulama/<dosya> | head -5
#      → "Content-Disposition: attachment" ve 200 görmelisin.
#
# ⚠ add_header MİRAS ALMAZ: bir location kendi add_header'ını tanımlarsa üst
# seviyedeki TÜM add_header'lar o yanıt için düşer. Bu yüzden güvenlik
# başlıkları burada TEKRARLANIYOR. Üst bloktaki değerler farklıysa oradan
# kopyala — eksik bırakma (bkz. 2026-08-19'da yaşanan kayıp).

location ^~ /uploads/uygulama/ {
    alias /home/baskici/baskici-saas/backend/uploads/uygulama/;
    autoindex off;

    # Tarayıcı açmaya çalışmasın, indirsin
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;

    # Sürüm dosya adında; aynı ad aynı dosya demek — uzun önbellek güvenli
    add_header Cache-Control "public, max-age=604800" always;

    # Güvenlik başlıkları (yukarıdaki trap yüzünden tekrar)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
