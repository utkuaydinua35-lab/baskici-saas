<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Telefon Modeli Değişikliği</title>
<style>
  :root{
    --bg:#0f1117; --card:#171a23; --card2:#1e2230; --border:#2a2f3e;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#863bff; --accent2:#6d28d9;
    --green:#22c55e; --green-bg:rgba(34,197,94,.12);
    --amber:#f59e0b; --amber-bg:rgba(245,158,11,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:540px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
  .satir{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
  .satir .k{color:var(--muted)}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  select{width:100%;padding:13px;font-size:16px;border-radius:12px;
    background:var(--card2);color:var(--text);border:1px solid var(--border)}
  select:focus{outline:none;border-color:var(--accent)}
  .btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;
    font-weight:700;cursor:pointer;margin-top:18px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .kutu{border-radius:12px;padding:13px 15px;font-size:14px;margin-bottom:14px}
  .ok{background:var(--green-bg);border:1px solid var(--green);color:#bbf7d0}
  .uyari{background:var(--amber-bg);border:1px solid var(--amber);color:#fde68a}
  .hata{background:rgba(239,68,68,.12);border:1px solid #ef4444;color:#fecaca}
  .kucuk{font-size:12.5px;color:var(--muted);margin-top:14px}
  .baslik{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.03em;
    text-transform:uppercase;margin:22px 0 8px}
  .kalem{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
    padding:10px 0;border-top:1px solid var(--border)}
  .kalem:first-child{border-top:0}
  .kalem .ad{font-size:13.5px}
  .kalem .mdl{font-size:12px;color:var(--muted);margin-top:2px}
  .rozet{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .r-hazir{background:var(--green-bg);color:#86efac;border:1px solid rgba(34,197,94,.4)}
  .r-bekl{background:var(--amber-bg);color:#fcd34d;border:1px solid rgba(245,158,11,.4)}
  .r-uret{background:rgba(134,59,255,.14);color:#c4b5fd;border:1px solid rgba(134,59,255,.4)}
  .bu{outline:1px solid var(--accent);outline-offset:4px;border-radius:8px}
  .adres{font-size:13px;color:#c8cede;line-height:1.6}
  .adres .k{color:var(--muted);font-size:12px}
  option:disabled{color:#6b7280}
</style>
</head>
<body>
<div class="wrap" id="kok">
  <div class="sub">Yükleniyor…</div>
</div>

<script>
// Token adresin son parçasında: /model-degisim/<token>
const TOKEN = location.pathname.split('/').filter(Boolean).pop();
const kok = document.getElementById('kok');

const kacir = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ekranBasit(sinif, baslik, metin) {
  kok.innerHTML = `<h1>${kacir(baslik)}</h1>
    <div class="kutu ${sinif}">${kacir(metin)}</div>`;
}

function saatKaldi(iso) {
  if (!iso) return '';
  const fark = new Date(iso) - new Date();
  if (fark <= 0) return '';
  const s = Math.floor(fark / 3600000), d = Math.floor((fark % 3600000) / 60000);
  return s > 0 ? `${s} saat ${d} dakika` : `${d} dakika`;
}

async function yukle() {
  let v;
  try {
    const r = await fetch(`/api/public/model-degisim/${encodeURIComponent(TOKEN)}`);
    if (r.status === 404) return ekranBasit('hata', 'Bağlantı bulunamadı',
      'Bu bağlantı geçersiz. Lütfen bizimle iletişime geçin.');
    v = await r.json();
  } catch {
    return ekranBasit('hata', 'Bağlantı kurulamadı',
      'İnternet bağlantını kontrol edip sayfayı yenile.');
  }

  if (v.durum === 'suresi_doldu') {
    return ekranBasit('uyari', 'Bağlantının süresi doldu',
      'Bu bağlantı artık geçerli değil. Siparişiniz beklemede; tedarik ' +
      'tamamlanınca üretime alınacaktır. Değişiklik isterseniz bize yazabilirsiniz.');
  }
  if (v.durum === 'uygulandi') {
    return ekranBasit('ok', 'Değişikliğiniz alındı',
      `Siparişiniz ${v.secilen_model || ''} olarak güncellendi. Üretime bu ` +
      'şekilde alınacak. Teşekkür ederiz!');
  }

  const kalan = saatKaldi(v.son_gecerlilik);
  const markalar = v.markalar || [];
  const sip = v.siparis || {};
  const kalemler = sip.kalemler || [];

  const rozetSinif = (d) => d === 'Hazır' ? 'r-hazir'
    : d === 'Stok bekleniyor' ? 'r-bekl' : 'r-uret';

  kok.innerHTML = `
    <h1>Telefon modeli değişikliği</h1>
    <div class="sub">Siparişinizdeki ürün şu an stokta olmadığı için telefon
      modelinizi değiştirebilirsiniz.${v.ozel_seri
        ? ' BERNZ Special ürünlerde yalnız aşağıdaki modeller üretilebiliyor.' : ''}</div>

    <div class="card">
      ${sip.no ? `<div class="satir"><span class="k">Sipariş</span><span>${kacir(sip.no)}</span></div>` : ''}
      ${v.urun ? `<div class="satir"><span class="k">Ürün</span><span>${kacir(v.urun)}</span></div>` : ''}
      ${v.mevcut_model ? `<div class="satir"><span class="k">Mevcut model</span><span>${kacir(v.mevcut_model)}</span></div>` : ''}
    </div>

    <div class="baslik">Yeni telefon modeli</div>
    <div class="card">
      <label for="marka">Marka</label>
      <select id="marka">
        <option value="">Seçiniz…</option>
        ${markalar.map((g, i) => `<option value="${i}">${kacir(g.marka)}</option>`).join('')}
      </select>

      <label for="model">Model</label>
      <select id="model" disabled>
        <option value="">Önce marka seçiniz</option>
      </select>

      <button class="btn" id="gonder" disabled>Değişikliği onayla</button>
      <div class="kucuk">
        ${kalan ? `Bu bağlantı ${kacir(kalan)} sonra geçersiz olacak. ` : ''}
        Onayladıktan sonra değişiklik hemen üretim planına işlenir ve bu bağlantı kapanır.
      </div>
    </div>

    ${kalemler.length ? `
      <div class="baslik">Siparişinizdeki ürünler</div>
      <div class="card">
        ${kalemler.map(k => `
          <div class="kalem${k.bu_kalem ? ' bu' : ''}">
            <span>
              <span class="ad">${kacir(k.urun)}</span>
              ${k.model ? `<span class="mdl">${kacir(k.model)}</span>` : ''}
            </span>
            <span class="rozet ${rozetSinif(k.durum)}">${kacir(k.durum)}</span>
          </div>`).join('')}
      </div>` : ''}

    ${(sip.ad || sip.telefon || sip.adres) ? `
      <div class="baslik">Teslimat bilgileriniz</div>
      <div class="card adres">
        ${sip.ad ? `<div><span class="k">Ad Soyad</span><br>${kacir(sip.ad)}</div>` : ''}
        ${sip.telefon ? `<div style="margin-top:8px"><span class="k">Telefon</span><br>${kacir(sip.telefon)}</div>` : ''}
        ${sip.adres ? `<div style="margin-top:8px"><span class="k">Adres</span><br>${kacir(sip.adres)}
          ${[sip.ilce, sip.il].filter(Boolean).length ? `<br>${kacir([sip.ilce, sip.il].filter(Boolean).join(' / '))}` : ''}</div>` : ''}
        <div class="kucuk">Bilgilerinizde bir yanlışlık varsa bu mesajı yanıtlayarak
          bize bildirebilirsiniz.</div>
      </div>` : ''}`;

  const marka = document.getElementById('marka');
  const model = document.getElementById('model');
  const gonder = document.getElementById('gonder');

  marka.onchange = () => {
    const g = markalar[Number(marka.value)];
    if (!g) {
      model.innerHTML = '<option value="">Önce marka seçiniz</option>';
      model.disabled = true; gonder.disabled = true; return;
    }
    // Stokta olmayan model LİSTELENİR ama seçilemez — "var ama şu an yok"
    // ile "hiç yok" farkı müşteriye görünsün.
    model.innerHTML = '<option value="">Seçiniz…</option>' + g.modeller.map(m => {
      const kapali = m.stokta === false || m.deger === v.mevcut_model;
      const not = m.stokta === false ? ' — şu an stokta yok'
        : (m.deger === v.mevcut_model ? ' — mevcut modeliniz' : '');
      return `<option value="${kacir(m.deger)}"${kapali ? ' disabled' : ''}>${kacir(m.etiket)}${not}</option>`;
    }).join('');
    model.disabled = false;
    gonder.disabled = true;
  };
  model.onchange = () => { gonder.disabled = !model.value; };

  gonder.onclick = async () => {
    gonder.disabled = true;
    gonder.textContent = 'Gönderiliyor…';
    try {
      const r = await fetch(`/api/public/model-degisim/${encodeURIComponent(TOKEN)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: model.value }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        ekranBasit('hata', 'Değişiklik yapılamadı',
          d.detail || 'Bir sorun oluştu. Lütfen bizimle iletişime geçin.');
        return;
      }
      ekranBasit('ok', 'Değişikliğiniz alındı',
        `Siparişiniz ${d.model} olarak güncellendi. Üretime bu şekilde ` +
        'alınacak. Teşekkür ederiz!');
    } catch {
      gonder.disabled = false;
      gonder.textContent = 'Değişikliği onayla';
      ekranBasit('hata', 'Bağlantı kurulamadı', 'Lütfen tekrar deneyin.');
    }
  };
}

yukle();
</script>
</body>
</html>
