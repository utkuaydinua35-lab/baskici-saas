# Dosya Aktarımı — 250 MB'a kadar yükleme + nginx'ten indirme.
#
# KURULUM (root), studio.bernzcompany.com server bloğunun İÇİNE:
#   1) Yükleme sınırı: blokta `client_max_body_size` 250M'den küçükse büyüt
#      (varsayılan 1M; 250 MB'lık yükleme 413 ile düşerdi).
#   2) Aşağıdaki internal location'ı ekle.
#   3) .env'e `NGINX_X_ACCEL=true` yaz ve backend'i yeniden başlat.
#   4) nginx -t && systemctl reload nginx
#
# NEDEN: indirmeyi backend yaparsa 250 MB'lık bir dosya uvicorn worker'ını
# dakikalarca meşgul eder ve o sırada panel yavaşlar. X-Accel-Redirect ile
# yetkiyi backend denetler, dosyayı NGINX gönderir.
#
# NGINX_X_ACCEL=true yapmadan bu bloğu eklemek zararsızdır; tersi DEĞİL —
# ayar açık ama location yoksa indirmeler 404 olur.

client_max_body_size 260M;   # 250 MB dosya + çok parçalı form payı

location /_dahili_aktarim/ {
    internal;                 # dışarıdan DOĞRUDAN erişilemez, yalnız backend yönlendirir
    alias /home/baskici/baskici-saas/backend/uploads/aktarim/;
}
